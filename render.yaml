services:
  - type: web
    name: ebook-reader-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    sourceDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DATABASE_PATH
        value: /tmp/data/library.db
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_REQUEST_LOGGING
        value: 'false'
      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: '5'
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: '900000'
      - key: RATE_LIMIT_MAX_REQUESTS
        value: '100'
      - key: RATE_LIMIT_WINDOW_MS
        value: '900000'
      - key: MAX_UPLOAD_REQUESTS_PER_HOUR
        value: '10'
      - key: AI_RATE_LIMIT_PER_HOUR
        value: '20'
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: baidu/cobuddy:free
      - key: ALLOWED_ORIGINS
        value: "http://localhost:8081,http://localhost:19006,exp://127.0.0.1:*"

